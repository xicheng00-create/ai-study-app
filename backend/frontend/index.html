<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F2714E">
  <title>AI 学习小组</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <div class="screen" id="screen"></div>
  </div>
  <div class="sheet-mask" id="sheetMask"><div class="sheet" id="sheet"></div></div>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/student.js"></script>
  <script src="/js/teacher.js"></script>
  <script>
    document.getElementById("sheetMask").addEventListener("click", e => { if (e.target.id === "sheetMask") closeSheet(); });
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").then((reg) => {
          // 新 SW 接管时自动刷新，确保用户看到最新版（修复旧版缓存问题）
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.addEventListener("controllerchange", () => location.reload());
          }
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
