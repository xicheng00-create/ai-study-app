<!DOCTYPE html>
<html lang="zh-CN">
<head>

    p { font-size:13px; color:#8E8E93; }
    .badge { display:inline-block; margin-top:12px; font-size:12px; padding:4px 10px; border-radius:999px; background:#E9E9EE; color:#3A3A3C; }
