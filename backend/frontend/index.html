<!DOCTYPE html>
<!-- 前端上线规则：静态资源带 ?v=<版本号> —— Cloudflare 对 .js/.css 强制 4h 浏览器缓存且覆盖源站 Cache-Control，
     不换 URL 的话用户（含 PWA）会继续跑旧 JS 数小时。每次前端改动须同步改这里的 ?v= 与 sw.js 的 CACHE 名。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F2714E">
  <title>AI 学习小组</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/css/style.css?v=2.7.2">
</head>
<body>
  <div id="app">
    <div class="screen" id="screen"></div>
  </div>
  <div class="sheet-mask" id="sheetMask"><div class="sheet" id="sheet"></div></div>
  <!-- 下载进度条：资料下载分块流式时显示百分比进度 -->
  <div id="dlProgress"><span class="dl-spin"></span><span id="dlProgressTxt">下载中</span><div id="dlProgressBar"><div id="dlProgressPct"></div></div></div>
  <script src="/js/api.js?v=2.7.2"></script>
  <script src="/js/app.js?v=2.7.2"></script>
  <script src="/js/student.js?v=2.7.2"></script>
  <script src="/js/teacher.js?v=2.7.2"></script>
  <script>
    document.getElementById("sheetMask").addEventListener("click", e => { if (e.target.id === "sheetMask") closeSheet(); });
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js?v=2.7.2").then((reg) => {
          // 新 SW 接管时自动刷新，确保用户看到最新版（修复旧版缓存问题）
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.addEventListener("controllerchange", () => location.reload());
          }
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
