# AI 学习小组 App · CI 流水线（GitHub Actions）
# 对齐四口之家 CI：fail-fast + 质量门禁（pytest≥50% 起步，阶段成熟后上 70）+ 密钥扫描 + smoke
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install ruff
        run: python -m pip install -q ruff
      - name: Ruff (Python 静态检查)
        run: ruff check backend/
      - name: Node syntax check (若前端有 JS)
        run: |
          for f in frontend/js/*.js; do node --check "$f"; done || true
      - name: Secret scan
        run: |
          if grep -rIlE -e '-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----' --exclude-dir=.git --exclude-dir=.venv .; then
            echo "::error::检测到私钥被提交，终止"; exit 1
          fi
          if grep -rIlE '(AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|xox[baprs]-)' --exclude-dir=.git --exclude-dir=.venv .; then
            echo "::error::检测到疑似云密钥，终止"; exit 1
          fi

  test-backend:
    name: Backend (pytest + 覆盖率≥50%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: python -m pip install -q -r requirements.txt
      - name: Pytest
        run: python -m pytest

  smoke:
    name: Smoke (启动服务 + /health)
    runs-on: ubuntu-latest
    needs: [test-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: python -m pip install -q -r requirements.txt
      - name: Boot & probe
        env:
          PORT: "5002"
          HOST: "127.0.0.1"
          FLASK_ENV: production
        run: |
          mkdir -p /tmp/aistudy_smoke
          python backend/app.py &
          APP_PID=$!
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5002/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5002/health
          kill "$APP_PID"
