function submitQuiz(){
  const q=QUIZZES.find(x=>x.id===state.activeQuiz);
  let correct=0,total=0;const wrong=[];
  q.qs.forEach((item,i)=>{if(item.type!=='essay'){total++;const ok=state.answers[i]===item.ans;if(ok)correct++;else wrong.push({t:item.t,your:item.opts[state.answers[i]]||'未作答',correct:item.opts[item.ans],reason:item.reason});}});
  const score=total?Math.round(correct/total*100*0.8+20):80;
  q.score=score;q.taken=true;q.wrong=wrong;
  const wrongHtml=wrong.length?wrong.map(w=>`<div class="wrong-q"><div class="qa"><b>题：</b>${esc(w.t)}</div><div class="qa" style="margin-top:5px"><span style="color:var(--red)">你的答案：${esc(w.your)}</span> &nbsp; <span style="color:var(--green)">正确答案：${esc(w.correct)}</span></div><div class="why">📌 ${esc(w.reason)}</div></div>`).join(''):'<div class="muted">全部正确 🎉</div>';

function trendChart(){
  if(SCORES.length<2)return '<div class="muted">暂无足够数据</div>';
  const w=300,h=90,pad=10;const max=100,min=0;
  const xs=SCORES.map((_,i)=>pad+i*(w-2*pad)/(SCORES.length-1));
  const ys=SCORES.map(s=>h-pad-(s.s-min)/(max-min)*(h-2*pad));
  const pts=ys.map((y,i)=>`${xs[i]},${y}`).join(' ');
  const dots=SCORES.map((s,i)=>`<circle cx="${xs[i]}" cy="${ys[i]}" r="3.5" fill="var(--accent-strong)"/><text x="${xs[i]}" y="${ys[i]-8}" font-size="9" text-anchor="middle" fill="var(--text-2)">${s.s}</text>`).join('');
  const labels=SCORES.map((s,i)=>`<text x="${xs[i]}" y="${h-1}" font-size="8" text-anchor="middle" fill="var(--text-3)">${esc(s.l)}</text>`).join('');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="margin-top:6px">
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    ${dots}${labels}</svg>`;
}

    </div>`).join(''):'<div class="muted" style="font-size:12.5px">尚未生成计划</div>';

    <div class="card"><div style="font-weight:700;margin-bottom:10px">掌握度分布</div><div class="donut-wrap">${donut}
      <div class="legend"><div><i style="background:#34C759"></i>已掌握 ${counts.master}</div><div><i style="background:#FF9F0A"></i>进行中 ${counts.prog}</div><div><i style="background:#FF3B30"></i>薄弱 ${counts.weak}</div><div><i style="background:#C9C2B8"></i>未评估 ${counts.na}</div></div></div></div>
    <div class="trend-wrap"><div style="font-weight:700;margin-bottom:6px">成绩趋势（PROG-003）</div>${trendChart()}</div>
    <div class="card"><div style="font-weight:700;margin-bottom:8px">各章节状态（PROG-002 按章提问）</div>${chapList}</div>
    <div class="card"><div style="font-weight:700;margin-bottom:8px">薄弱点（带依据）</div>${weakHtml}</div>
    <div class="card"><div style="font-weight:700;margin-bottom:8px">巩固练习闭环（PROG-006 · 间隔复习）</div>
      <div class="muted" style="margin-bottom:10px;font-size:12.5px">薄弱点 → 一键生成巩固练习，作答后按 1→3→7 天排入重做（答错重置 1 天）</div>
      ${reviewHtml}
      <button class="btn" style="margin-top:12px" onclick="genReview();render()">一键生成巩固练习（间隔复习）</button>
    </div>
  </div>`+tabbar();

function genReview(){
  const weak=Object.keys(MY_M).filter(id=>MY_M[id]!==null&&MY_M[id]<50);
  REVIEW=weak.map(id=>({ch:id,interval:1,status:'pending'}));
  toast('已为 '+weak.length+' 个薄弱章生成巩固练习（间隔复习 1→3→7）');
}
function openRev(ch){
  const rq=REVIEW_Q[ch];if(!rq){toast('该章暂无复习题（原型演示）');return;}
  let html=`<div class="row" style="font-weight:700">巩固练习 · ${esc(chapterName(ch))}</div>
    <div class="row" style="text-align:left;font-weight:500;font-size:14px;border:none;background:transparent">${esc(rq.t)}</div>`;
  rq.opts.forEach((o,oi)=>{html+=`<div class="row" style="text-align:left;border:none;background:transparent;padding:8px 16px" onclick="gradeRev('${ch}',${oi})">${String.fromCharCode(65+oi)}. ${esc(o)}</div>`;});
  html+=`<div class="row cancel" onclick="closeSheet()">取消</div>`;
  document.getElementById('sheet').innerHTML=html;document.getElementById('sheetMask').classList.add('show');
}
function gradeRev(ch,oi){
  const r=REVIEW.find(x=>x.ch===ch);if(!r)return;
  const rq=REVIEW_Q[ch];
  if(oi===rq.ans){r.interval=Math.min(r.interval*3,7);toast('答对 ✓ 间隔延长至 '+r.interval+' 天（1→3→7）');}
  else{r.interval=1;toast('答错 · 间隔重置为 1 天');}
  r.status='done';closeSheet();render();
}

/* ===== TEACHER: QUIZ publish (draft → confirm → revision) ===== */
let pubSel={};
function viewTeacherQuiz(){
  const chks=LIBRARY.map(f=>`<div class="folder">${esc(f.folder)}</div>`+f.chapters.map(c=>`<div class="chk ${pubSel[c.id]?'on':''}" onclick="pubSel['${c.id}']=!pubSel['${c.id}'];render()"><span class="box">${pubSel[c.id]?'✓':''}</span>${esc(c.name)}</div>`).join('')).join('');
  const sel=Object.keys(pubSel).filter(k=>pubSel[k]);
  const published=QUIZZES.filter(q=>q.status==='published').map(q=>{
    const ver=q.version>1?`<span class="badge ver">v${q.version}</span> `:'';
    return `<div class="card sm" style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:700">${ver}${esc(q.title)}</div><div class="muted">覆盖：${q.chapters.map(chapterName).map(esc).join('、')} · 全班同题</div></div>
      <div style="text-align:right"><span class="badge master">已发布</span><div style="margin-top:6px"><span class="mini-btn teacher" onclick="revisionQuiz('${q.id}')">重出</span></div></div></div>`;}).join('');
  const superseded=QUIZZES.filter(q=>q.status==='superseded').map(q=>`<div class="card sm" style="opacity:.6"><div style="display:flex;justify-content:space-between"><div style="font-weight:700">${esc(q.title)}</div><span class="badge super">已替换 v${q.version}</span></div><div class="muted" style="font-size:12px">覆盖：${q.chapters.map(chapterName).map(esc).join('、')}</div></div>`).join('');
  const drafts=QUIZZES.filter(q=>q.status==='draft').map(q=>`<div class="card sm" style="border-color:var(--teacher)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="font-weight:700">${esc(q.title)}</div><span class="badge na">草稿待确认</span></div>
      <div class="muted" style="font-size:12px;margin-bottom:8px">覆盖：${q.chapters.map(chapterName).map(esc).join('、')} · 含 ${q.qs.length} 道 AI 生成题</div>
      <div style="border:1px dashed var(--border);border-radius:10px;padding:10px;margin-bottom:10px">
        ${q.qs.map((it,i)=>`<div style="font-size:13px;margin-bottom:6px"><b>Q${i+1}.</b> ${esc(it.t)}</div>`).join('')}
      </div>
      <div style="display:flex;gap:8px"><button class="btn teacher sm" style="flex:1" onclick="confirmQuiz('${q.id}')">确认发布</button><button class="mini-btn danger" onclick="dropQuiz('${q.id}')">放弃</button></div>
    </div>`).join('');
  return appbar('出题 / 发布','选章 → 生成草稿 → 确认发布')+
  `<div class="content">
    <div class="card"><div style="font-weight:700;margin-bottom:6px">① 选择覆盖章节</div>${chks}
      <button class="btn teacher" style="margin-top:12px" onclick="publishQuiz()">生成草稿（${sel.length} 章）</button></div>
    ${drafts?`<div style="font-weight:700;font-size:14px;margin:12px 0 8px">待确认草稿（QUIZ-001 轻量审核）</div>${drafts}`:''}
    <div style="font-weight:700;font-size:15px;margin:14px 0 10px">已发布的测评</div>${published||'<div class="muted">暂无</div>'}
    ${superseded?`<div style="font-weight:700;font-size:14px;margin:14px 0 8px">历史版本</div>${superseded}`:''}
  </div>`+tabbar();
}
function publishQuiz(){
  const sel=Object.keys(pubSel).filter(k=>pubSel[k]);
  if(!sel.length){toast('请至少选择一章');return;}
  const id='q'+(QUIZZES.length+1);
  const qs=sel.map((c,i)=>({t:'（基于《'+chapterName(c)+'》AI 生成的 '+(i+1)+' 号题：选择题 / 判断题 / 简答）',type:'choice',opts:['A','B','C','D'],ans:0,reason:'（教师确认后由 GRADER 记录原因）'}));
  QUIZZES.push({id,title:'草稿 · '+sel.length+' 章',chapters:sel.slice(),version:1,status:'draft',taken:false,score:null,qs});
  pubSel={};toast('已生成草稿，请预览后确认发布');render();
}
function confirmQuiz(id){const q=QUIZZES.find(x=>x.id===id);if(q){q.status='published';q.title='新测评 · '+q.chapters.length+' 章';}toast('已发布，全班可见相同题目');render();}
function dropQuiz(id){const i=QUIZZES.findIndex(x=>x.id===id);if(i>=0)QUIZZES.splice(i,1);toast('已放弃草稿');render();}
function revisionQuiz(id){
  const old=QUIZZES.find(x=>x.id===id);if(!old)return;
  old.status='superseded';
  const nid='q'+(QUIZZES.length+1);
  const sel=old.chapters;
  const qs=sel.map((c,i)=>({t:'（重出：基于《'+chapterName(c)+'》新生成 '+(i+1)+' 号题）',type:'choice',opts:['A','B','C','D'],ans:0,reason:'（教师确认后记录）'}));
  QUIZZES.push({id:nid,title:'草稿 · 重出 v'+(old.version+1),chapters:sel.slice(),version:old.version+1,status:'draft',taken:false,score:null,qs});
  toast('已重出为新草稿 v'+(old.version+1)+'（旧版保留，F3 不污染掌握度）');render();
}
